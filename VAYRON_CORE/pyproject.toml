[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vayron-core"
version = "0.4.0"
description = "Original provider-agnostic foundation and neural baseline for Alili Vayron"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary project code; third-party components retain their own licenses." }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["torch>=2.2"]
media = ["Pillow>=10.0"]
vision = ["Pillow>=10.0", "transformers>=4.45", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
