[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vayron-core"
version = "0.1.0"
description = "Provider-agnostic foundation for Alili Vayron"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary project code; third-party components retain their own licenses." }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
